<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechCart - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding-top: 80px; }
        .card { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        h1 { font-size: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2b7a4b; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #23673f; }
        #error-message { color: #c0392b; margin-top: 12px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>TechCart Login</h1>
        <form id="login-form">
            <input id="user-name" type="text" placeholder="Username" autocomplete="off">
            <input id="password" type="password" placeholder="Password" autocomplete="off">
            <button id="login-button" type="submit">Login</button>
        </form>
        <div id="error-message" data-test="error-message"></div>
    </div>

    <script>
        const validUsers = {
            "ranjeet.pd": "ranjeet1",
            "locked_user": "ranjeet1"
        };

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('user-name').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-message');

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            errorBox.style.display = 'none';

            if (!username || !password) {
                showError('Username and password are required.');
                return;
            }
            if (username === 'locked_user') {
                showError('Sorry, this account has been locked.');
                return;
            }
            if (validUsers[username] !== password) {
                showError('Username and password do not match any account.');
                return;
            }

            window.location.href = 'products.html';
        });
    </script>
</body>
</html>
